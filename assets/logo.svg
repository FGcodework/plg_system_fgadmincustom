<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fgBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C2E4F"/>
      <stop offset="1" stop-color="#1C5687"/>
    </linearGradient>
    <!-- shadows follow the outline of the shape they belong to -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#06182A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- FG series squircle -->
  <rect x="10" y="10" width="492" height="492" rx="96" ry="96" fill="url(#fgBlue)"/>

  <!-- the logged-in administrator: header, sidebar, content (one outline, one shadow) -->
  <g filter="url(#shadow)">
    <path d="M150,162 H440 V350 A28,28 0 0 1 412,378 H150 Z" fill="#E9EFF7"/>
    <path d="M72,134 A28,28 0 0 1 100,106 H412 A28,28 0 0 1 440,134 V162 H72 Z" fill="#FF6B4A"/>
    <path d="M72,162 H156 V378 H100 A28,28 0 0 1 72,350 Z" fill="#164A78"/>
  </g>
  <circle cx="106" cy="134" r="12" fill="#FFFFFF"/>
  <rect x="176" y="184" width="104" height="26" rx="13" ry="13" fill="#C6D4E6"/>
  <rect x="176" y="224" width="70" height="20" rx="10" ry="10" fill="#D6E0ED"/>
  <rect x="98" y="184" width="40" height="12" rx="6" ry="6" fill="#5F8DB8"/>
  <rect x="98" y="212" width="40" height="12" rx="6" ry="6" fill="#5F8DB8"/>
  <rect x="98" y="240" width="40" height="12" rx="6" ry="6" fill="#5F8DB8"/>

  <!-- the login card in front -->
  <g filter="url(#shadow)">
    <rect x="236" y="196" width="208" height="214" rx="28" ry="28" fill="#FFFFFF"/>
  </g>
  <circle cx="340" cy="238" r="22" fill="#FF6B4A"/>
  <rect x="262" y="278" width="156" height="22" rx="11" ry="11" fill="#DCE4EF"/>
  <rect x="262" y="310" width="156" height="22" rx="11" ry="11" fill="#DCE4EF"/>
  <rect x="262" y="346" width="156" height="36" rx="18" ry="18" fill="#164A78"/>
</svg>
