; plg_system_fgadmincustom 1.0.7 - sk-SK
PLG_SYSTEM_FGADMINCUSTOM="System - FG Admin Customizer"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_LABEL="Vlastné logo"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_DESC="Obrázok zobrazený vycentrovaný nad prihlasovacou kartou."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_WIDTH_LABEL="Max. šírka loga (px)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_WIDTH_DESC="Maximálna zobrazená šírka vlastného loga."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_TEMPLATE_LOGO_LABEL="Skryť logo šablóny / Joomla branding"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_TEMPLATE_LOGO_DESC="Skryje logo šablóny v hlavičke (vľavo hore). Slot pre login logo nad formulárom ostáva zachovaný pre vlastné logo."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_CHROME_LABEL="Skryť hlavičku a pätičku"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_CHROME_DESC="Skryje hlavičku a pätičku admin šablóny na prihlasovacej stránke (čistý fullscreen vzhľad)."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_TYPE_LABEL="Typ pozadia"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_TYPE_NONE="- Predvolené zo šablóny -"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_TYPE_COLOR="Plná farba"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_TYPE_GRADIENT="Gradient"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_TYPE_IMAGE="Obrázok"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_COLOR_LABEL="Farba pozadia"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_GRAD_START_LABEL="Počiatočná farba gradientu"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_GRAD_END_LABEL="Koncová farba gradientu"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_GRAD_ANGLE_LABEL="Uhol gradientu (°)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_IMAGE_LABEL="Obrázok pozadia"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_IMAGE_DESC="Relatívna cesta k obrázku, napr. images/bg.jpg (od koreňa webu, bez úvodného lomítka). Textové pole - okno Media Manager sa tu nepoužíva."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_OVERLAY_LABEL="Farba prekrytia"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_OVERLAY_DESC="Polopriehľadné prekrytie nad obrázkom pozadia (zlepší čitateľnosť prihlasovacej karty)."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_OVERLAY_OPACITY_LABEL="Priehľadnosť prekrytia (%)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CARD_BG_LABEL="Pozadie karty"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CARD_TEXT_LABEL="Farba textu karty"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BTN_BG_LABEL="Pozadie tlačidla"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BTN_HOVER_LABEL="Pozadie tlačidla (hover)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BTN_TEXT_LABEL="Farba textu tlačidla"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LINK_COLOR_LABEL="Farba odkazov"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CUSTOM_CSS_LABEL="Vlastné CSS"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CUSTOM_CSS_DESC="Pridá sa ako posledné, platí iba na admin prihlasovacej stránke. Bez style tagov. Ak by pravidlo tu niekedy rozbilo prihlasovaciu stránku, otvor /administrator?fgac=off a zobrazí sa bez akýchkoľvek úprav."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_SIDEBAR_LABEL="Skryť ľavý panel"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_SIDEBAR_DESC="Skryje celý ľavý panel na prihlasovacej stránke (panel s logom šablóny aj modul 'Need Support?' s Joomla odkazmi)."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_FORGOT_LABEL="Skryť odkaz 'Forgot your login details?'"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_FORGOT_DESC="Skryje odkaz na obnovu hesla pod prihlasovacím formulárom (smeruje na Joomla user guide)."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_FOOTER_TEXT_LABEL="Text pod formulárom"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_FOOTER_TEXT_DESC="Voliteľný text alebo HTML zobrazený pod prihlasovacím tlačidlom (kde bol pôvodne odkaz 'Forgot your login details?'), napr. 'Created by ...'. Povolené: odkazy (http, https, mailto, tel), obrázky (http, https), zoznamy, p, div, span, br, hr, b, strong, i, em, u, small, sub, sup, abbr, s atribútmi class a title. Čokoľvek iné (script, style, id ...) robí celý text neplatným a nezobrazí sa."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HEADER_BG_LABEL="Farba pozadia horného pásu"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HEADER_BG_DESC="Farba pozadia horného pásu (viditeľné iba ak 'Skryť hlavičku a pätičku' nie je zapnuté)."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HEADER_TEXT_LABEL="Farba textu a ikon v páse"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HEADER_TEXT_DESC="Farba textu, odkazov a ikon v hornom páse."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_LANG_SWITCHER_LABEL="Skryť jazykový prepínač"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_LANG_SWITCHER_DESC="Skryje dropdown na výber jazyka (napr. 'en-GB') v hornom páse."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HEADER_MATCH_BTN_LABEL="Zladiť tlačidlo frontend odkazu s login tlačidlom"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HEADER_MATCH_BTN_DESC="Tlačidlo s odkazom na frontend v hornom páse (napr. 'Otvoriť názov webu') sa prefarbí rovnakými farbami (pozadie/hover/text), aké máš nastavené v karte 'Prihlásenie: Karta a farby' pre tlačidlo."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_HEIGHT_LABEL="Pevná výška loga (px)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_HEIGHT_DESC="Voliteľné. Nechaj prázdne pre voľné škálovanie (pomer strán sa vždy zachová, podľa hodnoty Max. šírka loga vyššie). Zadaním hodnoty dostane logo pevný box šírka × výška, podľa režimu Fit nižšie."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_FIT_LABEL="Režim vyplnenia (Fit)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_FIT_DESC="Platí iba ak je zadaná Pevná výška loga. Contain: celé logo je vždy viditeľné, môže ostať prázdny priestor. Cover: box je vyplnený celý, logo môže byť orezané."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_FIT_CONTAIN="Contain (zobraziť celé logo)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_FIT_COVER="Cover (vyplniť box, možný orez)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_LABEL="Aplikovať preset"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_DESC="Vyber farebnú schému a klikni Save. Farebné polia v celom formulári (pozadie, karta, tlačidlá, header) sa predvyplnia hodnotami presetu - skontroluj ich a klikni Save ešte raz, aby sa uložili. Menia sa iba farby; prepínače layoutu/súkromia (sidebar, chrome a pod.) ostávajú nedotknuté. Toto pole sa po použití samo vyprázdni."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_NONE="- Vyber preset -"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_RESET="Predvolené (farby šablóny Atum)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_DARK="Tmavá"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_CORPORATE_BLUE="Firemná modrá"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_GREEN="Zelená"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_ORANGE="Oranžová"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_MINIMAL="Minimalistická"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_AUTO_CONTRAST_DESC="Nechaj prázdne, ak je vyššie nastavená farba pozadia - automaticky sa dopočíta čitateľná čierna/biela farba textu (WCAG kontrast). Zadaním hodnoty tu automatický výpočet prepíšeš."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CUSTOM_JS_LABEL="Vlastný JavaScript"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CUSTOM_JS_DESC="Voliteľný JavaScript spustený iba na admin prihlasovacej stránke. Vypisuje sa v hlavičke stránky, takže beží skôr, než existuje prihlasovací formulár: kód, ktorý pracuje so stránkou, zaobaľ do počúvadla DOMContentLoaded. Nezaobaľuj ho do elementu script - vlož iba samotný kód. Používaj opatrne: beží bez sandboxovania, rovnaká úroveň dôvery ako Vlastné CSS."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_DARK_LABEL="Vlastné logo - tmavý režim"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_DARK_DESC="Voliteľné. Zobrazí sa namiesto vlastného loga, keď administrátor používa tmavú farebnú schému (aj keď sa riadi operačným systémom). Ak ostane prázdne, použije sa rovnaké logo v každom režime."
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_MENU_OPEN_FIRST_LABEL="Otvoriť prvú podpoložku"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_MENU_OPEN_FIRST_DESC="Kliknutie na komponent v menu Komponenty hneď otvorí jeho prvú podpoložku (ako v Joomla 3.10), namiesto len rozbalenia podmenu. Funguje v bočnom menu Atum aj v module Phoca Top Menu. Na dotykových zariadeniach zostáva rozbalenie."
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_HEADER_COLOR_LABEL="Farba hlavičky"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_HEADER_COLOR_DESC="Farba horného pásu. Ak ostane prázdne, použije sa farba značky."
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_SIDEBAR_FOLLOW_LABEL="Sidebar podľa hlavičky"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_SIDEBAR_FOLLOW_DESC="Ak nie je nastavená farba bočného panela, zafarbí ho rovnako ako hlavičku. Vypni, ak chceš ponechať sidebar Atum."
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_SIDEBAR_COLOR_LABEL="Farba bočného panela"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_SIDEBAR_COLOR_DESC="Pozadie bočného menu. Text na ňom sa automaticky prepne na tmavý, ak je farba svetlá. Ak ostane prázdne, ponechá sa sidebar Atum."
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_PAGE_BG_LABEL="Pozadie stránky"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_PAGE_BG_DESC="Pozadie stránok administrácie vo svetlej farebnej schéme. Ak ostane prázdne, ponechá sa pozadie Atum."
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_LOGO_LABEL="Logo v hlavičke"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_LOGO_DESC="Nahradí logo Joomla v hornom páse (zobrazené pri rozbalenom bočnom menu). Použi logo, ktoré je dobre čitateľné na farbe značky."
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_LOGO_SMALL_LABEL="Logo v hlavičke - malé"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_LOGO_SMALL_DESC="Voliteľné. Nahradí malé štvorcové logo zobrazené pri zbalenom bočnom menu. Ak ostane prázdne, ponechá sa logo šablóny."
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_LOGO_HEIGHT_LABEL="Výška loga v hlavičke (px)"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_LOGO_HEIGHT_DESC="Voliteľná pevná výška log v hlavičke (16-120). Ak ostane prázdne, ponechá sa veľkosť šablóny."
PLG_SYSTEM_FGADMINCUSTOM_FIELD_SUPPORT_DESC="<style>a.fg-kofi[target='_blank']::before{content:none;padding:0}</style><div class='mb-3'><strong>Tento plugin je bezplatný a open source.</strong> Ak vám ušetril čas, jednorazový príspevok na Ko-fi je vítaný, no úplne dobrovoľný - žiadna funkcia tu nie je zamknutá za platbou.</div><div class='d-flex align-items-center gap-3'><a href='https://ko-fi.com/fgcodework' target='_blank' rel='noopener noreferrer' class='fg-kofi'><img src='https://storage.ko-fi.com/cdn/kofi3.png?v=4' alt='ko-fi' width='180'></a><a href='https://fgcodework.github.io/' target='_blank' rel='noopener noreferrer' class='btn' style='--btn-color:var(--atum-btn);--btn-bg:var(--atum-btn-bg);--btn-border-color:hsl(var(--hue),20%,80%);--btn-hover-color:var(--atum-btn-hvr);--btn-hover-bg:var(--atum-btn-bg-hvr);--btn-hover-border-color:var(--atum-btn-bg-hvr);--btn-active-color:var(--atum-btn-hvr);--btn-active-bg:var(--atum-btn-bg-hvr);--btn-active-border-color:var(--atum-btn-bg-hvr)'>Ďalšie FG rozšírenia</a></div>"
PLG_SYSTEM_FGADMINCUSTOM_XML_DESCRIPTION="Prispôsobí administráciu Joomly (šablóna Atum) podľa jednej spoločnej značky: prihlasovaciu stránku (logo, pozadie, karta, farby) aj prihlásenú administráciu (hlavička, bočné menu, tlačidlá, logá). Nahrádza FG Admin Login Customizer a FG Admin Page Customizer. Joomla 5 a 6."
PLG_SYSTEM_FGADMINCUSTOM_FIELDSET_BRAND="Značka"
PLG_SYSTEM_FGADMINCUSTOM_FIELDSET_ADMIN="Administrácia"
PLG_SYSTEM_FGADMINCUSTOM_FIELDSET_IMPORTEXPORT="Export / Import"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_FIELDSET_BEHAVIOR="Správanie"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_FIELDSET_LOGO="Prihlásenie: Logo a rozloženie"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_FIELDSET_PRESET="Prihlásenie: Preddefinovaná téma"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_FIELDSET_BACKGROUND="Prihlásenie: Pozadie"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_FIELDSET_CARD="Prihlásenie: Karta a farby"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_FIELDSET_HEADER="Prihlásenie: Horný pás"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_FIELDSET_ADVANCED="Prihlásenie: Rozšírené"
PLG_SYSTEM_FGADMINCUSTOM_BRAND_COLOR_LABEL="Farba značky"
PLG_SYSTEM_FGADMINCUSTOM_BRAND_COLOR_DESC="Jedna farba pre administráciu a, pokiaľ si prihlasovacia stránka nenastaví vlastnú, aj pre ňu. V administrácii nastaví horný pás, zvýraznenia v bočnom menu, primárne tlačidlá, odkazy (vo svetlej farebnej schéme, kde je farba čitateľná na bielej) a orámovanie aktívneho poľa; na prihlasovacej stránke tlačidlo, odkazy, horný pás a orámovanie aktívneho poľa. Farby textu na nej sa vypočítajú automaticky. Ak ostane prázdne, ponechajú sa farby Atum."
PLG_SYSTEM_FGADMINCUSTOM_BRAND_CTRL_RADIUS_LABEL="Zaoblenie polí a tlačidiel (px)"
PLG_SYSTEM_FGADMINCUSTOM_BRAND_CTRL_RADIUS_DESC="Zaoblí rohy tlačidiel a polí formulára v administrácii aj na prihlasovacej stránke. Zoskupené polia a tlačidlá majú spoj rovný. Ak ostane prázdne, ponechá sa predvolené zaoblenie šablóny."
PLG_SYSTEM_FGADMINCUSTOM_BRAND_CARD_RADIUS_LABEL="Zaoblenie panelov (px)"
PLG_SYSTEM_FGADMINCUSTOM_BRAND_CARD_RADIUS_DESC="Zaoblí rohy kariet, panelov nastavení, rozbaľovacích ponúk a dialógov v administrácii a prihlasovaciu kartu. Ak ostane prázdne, ponechá sa predvolené zaoblenie šablóny."
PLG_SYSTEM_FGADMINCUSTOM_BRAND_BTN_SHADOW_LABEL="Tieň primárnych tlačidiel"
PLG_SYSTEM_FGADMINCUSTOM_BRAND_BTN_SHADOW_DESC="Pridá primárnym tlačidlám hĺbku, aj na prihlasovacej stránke."
PLG_SYSTEM_FGADMINCUSTOM_BRAND_CARD_SHADOW_LABEL="Tieň kariet"
PLG_SYSTEM_FGADMINCUSTOM_BRAND_CARD_SHADOW_DESC="Pridá kartám hĺbku (napríklad panelom na nástenke) aj prihlasovacej karte."
PLG_SYSTEM_FGADMINCUSTOM_SHADOW_NONE="Žiadny"
PLG_SYSTEM_FGADMINCUSTOM_SHADOW_SUBTLE="Jemný"
PLG_SYSTEM_FGADMINCUSTOM_SHADOW_MEDIUM="Stredný"
PLG_SYSTEM_FGADMINCUSTOM_SHADOW_STRONG="Silný"
PLG_SYSTEM_FGADMINCUSTOM_SHADOW_INHERIT="- Zo značky -"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_ENABLED_LABEL="Upravovať prihlásenú administráciu"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_ENABLED_DESC="Zapne alebo vypne všetky zmeny v prihlásenej administrácii. Nastavenia ostanú uložené. Vypnuté znamená, že šablóna Atum vyzerá tak, ako prišla."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_ENABLED_LABEL="Upravovať prihlasovaciu stránku"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_ENABLED_DESC="Zapne alebo vypne všetky zmeny prihlasovacej stránky. Nastavenia ostanú uložené. Vypnuté znamená, že prihlasovacia stránka vyzerá tak, ako ju dodáva šablóna Atum."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_USE_BRAND_LABEL="Použiť nastavenia značky"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_USE_BRAND_DESC="Farba značky, zaoblenie rohov a tiene z karty Značka sa na prihlasovacej stránke použijú všade tam, kde je zodpovedajúce pole nižšie prázdne. Vypni, ak má prihlasovacia stránka dostať iba tu zadané hodnoty."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BRAND_COLOR_DESC="Jedna farba pre celú prihlasovaciu stránku. Doplní pozadie tlačidla (hover je tmavší odtieň), farbu odkazov, pozadie hlavičky a orámovanie aktívneho poľa, pričom čitateľné farby textu sa vypočítajú automaticky. Každé pole nastavené nižšie alebo v karte Horný pás ju prepíše. Ak ostane prázdne, použije sa farba značky z karty Značka."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CARD_RADIUS_DESC="Ak ostane prázdne, použije sa hodnota z karty Značka."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CTRL_RADIUS_DESC="Zaoblí rohy polí pre meno/heslo a tlačidiel. Ak ostane prázdne, použije sa karta Značka (a ak je prázdna aj tá, predvolené zaoblenie šablóny)."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BTN_SHADOW_DESC="Pridá tlačidlám prihlásenia hĺbku. 'Zo značky' použije nastavenie z karty Značka."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CARD_SHADOW_DESC="Pridá hĺbku pod prihlasovaciu kartu. 'Zo značky' použije nastavenie z karty Značka."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CARD_SHADOW_LABEL="Tieň karty"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BTN_SHADOW_LABEL="Tieň tlačidiel"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BRAND_COLOR_LABEL="Farba značky"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CARD_RADIUS_LABEL="Zaoblenie karty (px)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CTRL_RADIUS_LABEL="Zaoblenie polí a tlačidiel (px)"
PLG_SYSTEM_FGADMINCUSTOM_EXPORT_JSON_LABEL="Export (aktuálne nastavenia)"
PLG_SYSTEM_FGADMINCUSTOM_EXPORT_JSON_DESC="Iba na čítanie. Skopíruj tento JSON a prenes nastavenia do kópie pluginu na inej stránke (vlož ho tam do poľa Import). Cesty k logám sa kopírujú ako text - súbory obrázkov musia existovať na rovnakej ceste aj na druhej stránke."
PLG_SYSTEM_FGADMINCUSTOM_IMPORT_JSON_LABEL="Import"
PLG_SYSTEM_FGADMINCUSTOM_IMPORT_JSON_DESC="Vlož JSON exportovaný z tohto pluginu, z FG Admin Login Customizer alebo z FG Admin Page Customizer a klikni na Uložiť. Polia sa na tej istej obrazovke obnovia importovanými hodnotami - skontroluj ich a klikni na Uložiť ešte raz, aby sa použili. Toto pole sa po použití samo vyprázdni. Z bezpečnostných dôvodov sa Vlastný JavaScript a Vlastné CSS nikdy neimportujú - ak ich potrebuješ, zadaj ich ručne."
PLG_SYSTEM_FGADMINCUSTOM_IMPORT_APPLIED="Import bol použitý v poliach - skontroluj ich a klikni znova na Uložiť, aby sa uložili."
PLG_SYSTEM_FGADMINCUSTOM_IMPORT_INVALID_JSON="Vložený text pre Import nie je platný JSON - nič sa nezmenilo."
PLG_SYSTEM_FGADMINCUSTOM_IMPORT_SKIPPED="Preskočené neplatné hodnoty: %s"
PLG_SYSTEM_FGADMINCUSTOM_IMPORT_LEGACY="Vložený JSON pochádza z FG Admin Login Customizer alebo FG Admin Page Customizer a bol prevedený na nastavenia tohto pluginu."
PLG_SYSTEM_FGADMINCUSTOM_IMPORT_CODE_SKIPPED="Zámerne ignorované: %s. Vlastný JavaScript a Vlastné CSS sa nikdy neimportujú - skript by bežal na prihlasovacej stránke, kde sú polia s menom a heslom, a štýl ju vie zmeniť na zavádzajúcu napodobeninu. Ak im dôveruješ a naozaj ich potrebuješ, prenes ich ručne."
PLG_SYSTEM_FGADMINCUSTOM_PRESET_APPLIED="Preset bol aplikovaný do farebných polí prihlasovacej stránky - skontroluj ich a klikni znova na Uložiť, aby sa uložili."
PLG_SYSTEM_FGADMINCUSTOM_SAFE_MODE_ACTIVE="FG Admin Customizer je pre túto reláciu vypnutý. Zapneš ho otvorením ľubovoľnej stránky administrácie s pridaným ?fgac=on v adrese."
PLG_SYSTEM_FGADMINCUSTOM_REPLACED_PLUGIN_ENABLED="Plugin %s je stále zapnutý. Tento plugin ho nahrádza a obidva spolu by upravovali tie isté stránky dvakrát. Vypni ho v zozname pluginov. Pozor: záchranný prepínač ?fgac=off ho nevypne."
PLG_SYSTEM_FGADMINCUSTOM_NOT_ATUM="Tento plugin je napísaný pre administrátorskú šablónu Atum (alebo jej potomka) a používa sa iná šablóna. Nastavenia prihláseného administrátora tu nemajú žiadny účinok a pravidlá prihlasovacej stránky nemusia sedieť."
