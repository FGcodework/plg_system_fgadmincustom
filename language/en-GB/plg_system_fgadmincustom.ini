; plg_system_fgadmincustom 1.0.4 - en-GB
PLG_SYSTEM_FGADMINCUSTOM="System - FG Admin Customizer"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_LABEL="Custom logo"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_DESC="Image shown centered above the login card."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_WIDTH_LABEL="Logo max width (px)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_WIDTH_DESC="Maximum display width of the custom logo."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_TEMPLATE_LOGO_LABEL="Hide template logo / Joomla branding"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_TEMPLATE_LOGO_DESC="Hides the header (top-left) template logo. The login-logo slot above the form is kept for the custom logo."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_CHROME_LABEL="Hide header & footer"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_CHROME_DESC="Hides the admin template header and footer on the login page for a clean full-screen look."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_TYPE_LABEL="Background type"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_TYPE_NONE="- Template default -"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_TYPE_COLOR="Solid color"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_TYPE_GRADIENT="Gradient"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_TYPE_IMAGE="Image"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_COLOR_LABEL="Background color"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_GRAD_START_LABEL="Gradient start color"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_GRAD_END_LABEL="Gradient end color"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_GRAD_ANGLE_LABEL="Gradient angle (deg)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_IMAGE_LABEL="Background image"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_IMAGE_DESC="Relative path to the image, e.g. images/bg.jpg (from the site root, no leading slash). Plain text field - the Media Manager browse dialog is not used here."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_OVERLAY_LABEL="Overlay color"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_OVERLAY_DESC="Semi-transparent overlay above the background image (improves login card readability)."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BG_OVERLAY_OPACITY_LABEL="Overlay opacity (%)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CARD_BG_LABEL="Card background"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CARD_TEXT_LABEL="Card text color"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BTN_BG_LABEL="Button background"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BTN_HOVER_LABEL="Button hover background"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BTN_TEXT_LABEL="Button text color"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LINK_COLOR_LABEL="Link color"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CUSTOM_CSS_LABEL="Custom CSS"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CUSTOM_CSS_DESC="Appended last, applied only on the admin login page. No style tags. If a rule here ever breaks the login page, open /administrator?fgac=off to see it without any customization."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_SIDEBAR_LABEL="Hide left sidebar"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_SIDEBAR_DESC="Hides the whole left panel on the login page (template logo panel and the 'Need Support?' Joomla links module)."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_FORGOT_LABEL="Hide 'Forgot your login details?' link"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_FORGOT_DESC="Hides the password recovery link below the login form (points to the Joomla user guide)."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_FOOTER_TEXT_LABEL="Footer text below the form"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_FOOTER_TEXT_DESC="Optional text or HTML shown below the login button (where the 'Forgot your login details?' link used to be), e.g. 'Created by ...'. Links allowed."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HEADER_BG_LABEL="Header background color"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HEADER_BG_DESC="Background color of the top header bar (only visible when 'Hide header & footer' is off)."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HEADER_TEXT_LABEL="Header text & icon color"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HEADER_TEXT_DESC="Color of the text, links and icons in the header bar."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_LANG_SWITCHER_LABEL="Hide language switcher"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HIDE_LANG_SWITCHER_DESC="Hides the language dropdown (e.g. 'en-GB') in the header bar."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HEADER_MATCH_BTN_LABEL="Match frontend-link button to login button"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_HEADER_MATCH_BTN_DESC="Colors the header's frontend-link button (e.g. 'Open site name') using the same Button background/hover/text colors set in 'Login: Card & colors'."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_HEIGHT_LABEL="Logo fixed height (px)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_HEIGHT_DESC="Optional. Leave empty for free scaling (aspect ratio always preserved, using Logo max width above). Set a value to give the logo a fixed width x height box, using the Fit mode below."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_FIT_LABEL="Fit mode"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_FIT_DESC="Only applies when Logo fixed height is set. Contain: whole logo always visible, may leave empty space. Cover: fills the box completely, may crop the logo."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_FIT_CONTAIN="Contain (show whole logo)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_FIT_COVER="Cover (fill box, may crop)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_LABEL="Apply a preset"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_DESC="Pick a color scheme and click Save. The color fields throughout this form (background, card, buttons, header) will refresh with the preset's values - review and click Save once more to apply. Only colors change; layout/privacy toggles (sidebar, chrome, etc.) are left untouched. This field resets itself after use."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_NONE="- Select a preset -"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_RESET="Default (Atum template colors)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_DARK="Dark"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_CORPORATE_BLUE="Corporate Blue"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_GREEN="Green"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_ORANGE="Orange"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_THEME_PRESET_MINIMAL="Minimal"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_AUTO_CONTRAST_DESC="Leave empty when a background color above is set to auto-calculate a readable black/white text color (WCAG contrast). Set a value here to override the automatic choice."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CUSTOM_JS_LABEL="Custom JavaScript"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CUSTOM_JS_DESC="Optional JavaScript executed on the admin login page only (loaded deferred). Do not wrap it in a script element - paste only the code itself. Use with care: this runs with no sandboxing, same trust level as Custom CSS."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_DARK_LABEL="Custom logo - dark mode"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_LOGO_DARK_DESC="Optional. Shown instead of the custom logo when the administrator uses the dark color scheme (also when it follows the operating system). Leave empty to use the same logo in every mode."
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_MENU_OPEN_FIRST_LABEL="Open first submenu item"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_MENU_OPEN_FIRST_DESC="Clicking a component in the Components menu opens its first submenu item directly (as in Joomla 3.10) instead of only expanding the submenu. Works in the Atum sidebar and in the Phoca Top Menu module. Touch devices keep the expand behaviour."
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_HEADER_COLOR_LABEL="Header color"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_HEADER_COLOR_DESC="Color of the top bar. Leave empty to use the brand color."
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_SIDEBAR_FOLLOW_LABEL="Sidebar follows header"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_SIDEBAR_FOLLOW_DESC="Colors the sidebar menu like the header when no sidebar color is set. Turn off to keep the Atum sidebar."
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_SIDEBAR_COLOR_LABEL="Sidebar color"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_SIDEBAR_COLOR_DESC="Background of the sidebar menu. Text on it is switched to dark automatically when the color is light. Leave empty to keep the Atum sidebar."
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_PAGE_BG_LABEL="Page background"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_PAGE_BG_DESC="Background of the administrator pages in the light color scheme. Leave empty to keep the Atum background."
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_LOGO_LABEL="Header logo"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_LOGO_DESC="Replaces the Joomla logo in the header bar (shown while the sidebar menu is expanded). Use a logo that reads well on your brand color."
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_LOGO_SMALL_LABEL="Header logo - small"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_LOGO_SMALL_DESC="Optional. Replaces the small square logo shown while the sidebar menu is collapsed. Leave empty to keep the template's own."
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_LOGO_HEIGHT_LABEL="Header logo height (px)"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_LOGO_HEIGHT_DESC="Optional fixed height of the header logos (16-120). Leave empty to keep the template's size."
PLG_SYSTEM_FGADMINCUSTOM_FIELD_SUPPORT_DESC="<style>a.fg-kofi[target='_blank']::before{content:none;padding:0}</style><div class='mb-3'><strong>This plugin is free and open source.</strong> If it has saved you time, a one-off tip on Ko-fi is welcome but entirely optional - no feature here is ever locked behind a paywall.</div><div class='d-flex align-items-center gap-3'><a href='https://ko-fi.com/fgcodework' target='_blank' rel='noopener noreferrer' class='fg-kofi'><img src='https://storage.ko-fi.com/cdn/kofi3.png?v=4' alt='ko-fi' width='180'></a><a href='https://fgcodework.github.io/' target='_blank' rel='noopener noreferrer' class='btn' style='--btn-color:var(--atum-btn);--btn-bg:var(--atum-btn-bg);--btn-border-color:hsl(var(--hue),20%,80%);--btn-hover-color:var(--atum-btn-hvr);--btn-hover-bg:var(--atum-btn-bg-hvr);--btn-hover-border-color:var(--atum-btn-bg-hvr);--btn-active-color:var(--atum-btn-hvr);--btn-active-bg:var(--atum-btn-bg-hvr);--btn-active-border-color:var(--atum-btn-bg-hvr)'>More FG Extensions</a></div>"
PLG_SYSTEM_FGADMINCUSTOM_XML_DESCRIPTION="Restyles the Joomla administrator (Atum template) from one shared brand: the login page (logo, background, card, colors) and the logged-in administrator (header, sidebar, buttons, logos). Replaces FG Admin Login Customizer and FG Admin Page Customizer. Joomla 5 and 6."
PLG_SYSTEM_FGADMINCUSTOM_FIELDSET_BRAND="Brand"
PLG_SYSTEM_FGADMINCUSTOM_FIELDSET_ADMIN="Administrator"
PLG_SYSTEM_FGADMINCUSTOM_FIELDSET_IMPORTEXPORT="Export / Import"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_FIELDSET_BEHAVIOR="Behavior"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_FIELDSET_LOGO="Login: Logo & Layout"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_FIELDSET_PRESET="Login: Theme Preset"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_FIELDSET_BACKGROUND="Login: Background"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_FIELDSET_CARD="Login: Card & colors"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_FIELDSET_HEADER="Login: Header bar"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_FIELDSET_ADVANCED="Login: Advanced"
PLG_SYSTEM_FGADMINCUSTOM_BRAND_COLOR_LABEL="Brand color"
PLG_SYSTEM_FGADMINCUSTOM_BRAND_COLOR_DESC="One color for the administrator and, unless the login page sets its own, for the login page. In the administrator it sets the header bar, the highlights in the sidebar menu, the primary buttons, the links (in the light color scheme, where the color is readable on white) and the focus ring of form fields; on the login page the button, the links, the header bar and the focus ring. Text colors on top of it are calculated automatically. Leave empty to keep the Atum colors."
PLG_SYSTEM_FGADMINCUSTOM_BRAND_CTRL_RADIUS_LABEL="Fields and buttons border radius (px)"
PLG_SYSTEM_FGADMINCUSTOM_BRAND_CTRL_RADIUS_DESC="Rounds the corners of buttons and form fields in the administrator and on the login page. Grouped fields and buttons keep a flat joint. Leave empty to keep the template default."
PLG_SYSTEM_FGADMINCUSTOM_BRAND_CARD_RADIUS_LABEL="Panels border radius (px)"
PLG_SYSTEM_FGADMINCUSTOM_BRAND_CARD_RADIUS_DESC="Rounds the corners of cards, option panels, dropdown menus and dialogs in the administrator, and the login card. Leave empty to keep the template default."
PLG_SYSTEM_FGADMINCUSTOM_BRAND_BTN_SHADOW_LABEL="Primary button shadow"
PLG_SYSTEM_FGADMINCUSTOM_BRAND_BTN_SHADOW_DESC="Adds depth below the primary buttons, also on the login page."
PLG_SYSTEM_FGADMINCUSTOM_BRAND_CARD_SHADOW_LABEL="Card shadow"
PLG_SYSTEM_FGADMINCUSTOM_BRAND_CARD_SHADOW_DESC="Adds depth below cards (for example the dashboard panels) and the login card."
PLG_SYSTEM_FGADMINCUSTOM_SHADOW_NONE="None"
PLG_SYSTEM_FGADMINCUSTOM_SHADOW_SUBTLE="Subtle"
PLG_SYSTEM_FGADMINCUSTOM_SHADOW_MEDIUM="Medium"
PLG_SYSTEM_FGADMINCUSTOM_SHADOW_STRONG="Strong"
PLG_SYSTEM_FGADMINCUSTOM_SHADOW_INHERIT="- From Brand -"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_ENABLED_LABEL="Customize the logged-in administrator"
PLG_SYSTEM_FGADMINCUSTOM_ADMIN_ENABLED_DESC="Switches all changes of the logged-in administrator on or off. The settings stay saved. Off means the Atum template looks as it comes."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_ENABLED_LABEL="Customize the login page"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_ENABLED_DESC="Switches all changes of the login page on or off. The settings stay saved. Off means the login page looks as the Atum template delivers it."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_USE_BRAND_LABEL="Use Brand settings"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_USE_BRAND_DESC="The brand color, corner radii and shadows of the Brand tab are used on the login page wherever the matching field below is empty. Turn off to give the login page only the values entered here."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BRAND_COLOR_DESC="One color for the whole login page. It fills in the button background (hover is a darker shade), the link color, the header bar background and the focus ring of the fields, with readable text colors calculated automatically. Any field set explicitly below or in the Header bar tab overrides it. Leave empty to use the brand color of the Brand tab."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CARD_RADIUS_DESC="Leave empty to use the value of the Brand tab."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CTRL_RADIUS_DESC="Rounds the corners of the username/password fields and the buttons. Leave empty to use the Brand tab (or, when that is empty too, the template default)."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BTN_SHADOW_DESC="Adds depth below the login buttons. 'From Brand' uses the setting of the Brand tab."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CARD_SHADOW_DESC="Adds depth below the login card. 'From Brand' uses the setting of the Brand tab."
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CARD_SHADOW_LABEL="Card shadow"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BTN_SHADOW_LABEL="Button shadow"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_BRAND_COLOR_LABEL="Brand color"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CARD_RADIUS_LABEL="Card border radius (px)"
PLG_SYSTEM_FGADMINCUSTOM_LOGIN_CTRL_RADIUS_LABEL="Fields and buttons border radius (px)"
PLG_SYSTEM_FGADMINCUSTOM_EXPORT_JSON_LABEL="Export (current settings)"
PLG_SYSTEM_FGADMINCUSTOM_EXPORT_JSON_DESC="Read-only. Copy this JSON to transfer the settings to another site's copy of this plugin (paste it into the Import field there). Logo paths are copied as text - the image files must exist at the same path on the other site."
PLG_SYSTEM_FGADMINCUSTOM_IMPORT_JSON_LABEL="Import"
PLG_SYSTEM_FGADMINCUSTOM_IMPORT_JSON_DESC="Paste JSON exported from this plugin, from FG Admin Login Customizer or from FG Admin Page Customizer and click Save. The fields refresh with the imported values on this same screen - review them and click Save once more to apply. This field clears itself after use. For security, Custom JavaScript and Custom CSS are never imported - enter them manually if you need them."
PLG_SYSTEM_FGADMINCUSTOM_IMPORT_APPLIED="Import applied to the fields - review and click Save again to store them."
PLG_SYSTEM_FGADMINCUSTOM_IMPORT_INVALID_JSON="The pasted Import text is not valid JSON - nothing was changed."
PLG_SYSTEM_FGADMINCUSTOM_IMPORT_SKIPPED="Skipped invalid value(s): %s"
PLG_SYSTEM_FGADMINCUSTOM_IMPORT_LEGACY="The pasted JSON comes from FG Admin Login Customizer or FG Admin Page Customizer and was converted to the settings of this plugin."
PLG_SYSTEM_FGADMINCUSTOM_IMPORT_CODE_SKIPPED="Ignored on purpose: %s. Custom JavaScript and Custom CSS are never imported - script would run on the login page, where the username and password fields are, and style can turn it into a look-alike. Copy them over by hand if you trust them and really need them."
PLG_SYSTEM_FGADMINCUSTOM_PRESET_APPLIED="Preset applied to the login color fields - review and click Save again to store them."
PLG_SYSTEM_FGADMINCUSTOM_SAFE_MODE_ACTIVE="FG Admin Customizer is switched off for this session. Open any administrator page with ?fgac=on added to the address to switch it back on."
PLG_SYSTEM_FGADMINCUSTOM_REPLACED_PLUGIN_ENABLED="The plugin %s is still enabled. This plugin replaces it, and both together would style the same pages twice. Disable it in the plugin list. Note that the recovery switch ?fgac=off does not switch it off."
PLG_SYSTEM_FGADMINCUSTOM_MIGRATION_DONE="The settings of FG Admin Login Customizer and FG Admin Page Customizer were copied into this plugin and it was switched on. The old plugins were switched off, not uninstalled - uninstall them once everything works."
PLG_SYSTEM_FGADMINCUSTOM_MIGRATION_DONE_OFF="The settings of FG Admin Login Customizer and FG Admin Page Customizer were copied into this plugin. Both were disabled, so this plugin was left disabled as well."
PLG_SYSTEM_FGADMINCUSTOM_MIGRATION_FAILED="The settings of the old FG Admin Login/Page Customizer plugins could not be copied (%s). Nothing was changed; paste their Export JSON into the Import field of this plugin instead."
PLG_SYSTEM_FGADMINCUSTOM_MIGRATION_ROLLBACK_FAILED="The settings of the old FG Admin Login/Page Customizer plugins could not be copied and the change could not be rolled back (%s). Check Extensions - Plugins: make sure that either this plugin or the old FG Admin Login/Page Customizer plugins are enabled, not both."
PLG_SYSTEM_FGADMINCUSTOM_MIGRATION_GENERATOR="FG Admin Login Customizer used to remove the generator meta tag from the login page. This plugin does not; install and enable the plugin FG Remove Generator to keep it hidden."
PLG_SYSTEM_FGADMINCUSTOM_MIGRATION_ISOLATED="The login page did not share the brand settings of the administrator before, so 'Use Brand settings' is off for it (tab Login: Card & colors). Switch it on to give both the same look."
