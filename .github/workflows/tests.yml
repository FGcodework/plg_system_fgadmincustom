name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, libxml, simplexml
          coverage: none

      - name: Syntax check
        run: |
          find . -name '*.php' -not -path './tests/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Test suites (manifest, unit, plugin, installer)
        run: php tests/run.php
